<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="col-md-5 bg-white p-4 rounded shadow">
      <h2 class="text-center fw-bold mb-3">Recuperar Contraseña</h2>
  
      <!-- Paso 1: Solicitar email -->
      <form *ngIf="step === 1" (ngSubmit)="requestResetCode()">
        <p class="text-center text-muted">
          Ingresa tu correo electrónico para recibir un código de recuperación.
        </p>
        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Correo electrónico"
            required
          />
          <label for="email">Correo electrónico</label>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary fw-bold">
            Enviar Código
          </button>
        </div>
      </form>
  
      <!-- Paso 2: Ingresar token y nueva contraseña -->
      <form *ngIf="step === 2" (ngSubmit)="resetPassword()">
        <p class="text-center text-muted">
          Ingresa el código que recibiste y tu nueva contraseña.
        </p>
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="token"
            [(ngModel)]="token"
            name="token"
            placeholder="Código de recuperación"
            required
          />
          <label for="token">Código de recuperación</label>
        </div>
        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="newPassword"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="Nueva contraseña"
            required
          />
          <label for="newPassword">Nueva contraseña</label>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary fw-bold">
            Restablecer Contraseña
          </button>
        </div>
      </form>
  
      <div class="text-center mt-3">
        <a routerLink="/login" class="text-primary fw-semibold">
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
